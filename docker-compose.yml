# PostgreSQL local para desenvolvimento e testes.
# Credenciais lidas do .env (POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB).
services:
  postgres:
    image: postgres:17-alpine
    container_name: tuia-joias-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?defina POSTGRES_USER no .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:?defina POSTGRES_DB no .env}
    ports:
      - '5432:5432'
    volumes:
      - tuia_joias_pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  tuia_joias_pgdata:
